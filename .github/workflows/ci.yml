name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}
      - name: Install xvfb (Linux, for the GUI smoke test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test
        if: runner.os != 'Linux'
        run: uv run pytest
      - name: Test (under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest
      - name: Check translations are complete
        run: uv run tools/extract_messages.py --check
      - name: DEBUG probe
        if: failure() && runner.os == 'Linux'
        run: |
          cat > /tmp/dbg.py <<'PY'
          import sys, pathlib, glob
          sys.path[:0] = ['.', 'tests']
          from test_integration import make_camera, run_airnefcmd
          cam = make_camera(probe_initiator_on_open=True)
          p = pathlib.Path('/tmp/dbgrun'); p.mkdir(exist_ok=True)
          r = run_airnefcmd(cam, p, '--action', 'listfiles', '--logginglevel', 'debug')
          print(r.returncode)
          for f in glob.glob('/tmp/dbgrun/**/*.log', recursive=True) + glob.glob('/tmp/dbgrun/**/*.txt', recursive=True):
              print('=====', f); print(open(f, errors='replace').read()[-6000:])
          PY
          uv run python /tmp/dbg.py || true
